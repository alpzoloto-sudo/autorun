name: Build DirectInput test overlay
# Test branch build for the native DirectInput bridge.

on:
  workflow_dispatch:
  push:
    branches:
      - nfsu2-directinput
    paths:
      - 'dlls/dinput/**'
      - '.github/workflows/build-directinput-overlay.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex python3 perl pkg-config curl xz-utils zip unzip

      - name: Install LLVM-MinGW 20260505
        run: |
          curl -L --fail --retry 3 \
            -o /tmp/llvm-mingw.tar.xz \
            https://github.com/mstorsjo/llvm-mingw/releases/download/20260505/llvm-mingw-20260505-ucrt-ubuntu-22.04-x86_64.tar.xz
          sudo mkdir -p /opt/llvm-mingw
          sudo tar -xJf /tmp/llvm-mingw.tar.xz --strip-components=1 -C /opt/llvm-mingw
          /opt/llvm-mingw/bin/i686-w64-mingw32-clang --version
          /opt/llvm-mingw/bin/aarch64-w64-mingw32-clang --version

      - name: Configure Wine PE build
        run: |
          mkdir -p wine-nx-probe/build-wine-wow64-pe-ci
          cd wine-nx-probe/build-wine-wow64-pe-ci
          PATH="/opt/llvm-mingw/bin:$PATH" ../../configure \
            --enable-archs=aarch64,i386 \
            --enable-winebox64=aarch64

      - name: Build DirectInput module
        run: |
          PATH="/opt/llvm-mingw/bin:$PATH" \
            make -C wine-nx-probe/build-wine-wow64-pe-ci -j2 \
            include/all \
            dlls/dinput/i386-windows/dinput.dll \
            dlls/dinput8/i386-windows/dinput8.dll \
            dlls/d3dx9_43/i386-windows/d3dx9_43.dll
          file wine-nx-probe/build-wine-wow64-pe-ci/dlls/dinput/i386-windows/dinput.dll
          file wine-nx-probe/build-wine-wow64-pe-ci/dlls/dinput8/i386-windows/dinput8.dll
          file wine-nx-probe/build-wine-wow64-pe-ci/dlls/d3dx9_43/i386-windows/d3dx9_43.dll

      - name: Fetch NFSU2 Widescreen Fix
        run: |
          curl -L --fail --retry 3 \
            -o /tmp/nfsu2-widescreen.zip \
            https://github.com/ThirteenAG/WidescreenFixesPack/releases/download/nfsu2/NFSUnderground2.WidescreenFix.zip
          rm -rf /tmp/nfsu2-widescreen
          mkdir -p /tmp/nfsu2-widescreen
          unzip -q /tmp/nfsu2-widescreen.zip -d /tmp/nfsu2-widescreen
          find /tmp/nfsu2-widescreen -maxdepth 4 -type f -print

      - name: Make SD overlay
        run: |
          mkdir -p overlay/switch/wine/drive_c/windows/syswow64
          cp wine-nx-probe/build-wine-wow64-pe-ci/dlls/dinput/i386-windows/dinput.dll \
             overlay/switch/wine/drive_c/windows/syswow64/dinput.dll
          cp wine-nx-probe/build-wine-wow64-pe-ci/dlls/dinput8/i386-windows/dinput8.dll \
             overlay/switch/wine/drive_c/windows/syswow64/dinput8.dll
          cp wine-nx-probe/build-wine-wow64-pe-ci/dlls/d3dx9_43/i386-windows/d3dx9_43.dll \
             overlay/switch/wine/drive_c/windows/syswow64/d3dx9_43.dll

          mkdir -p "overlay/switch/wine/drive_c/Need for Speed Underground 2"
          cat > "overlay/switch/wine/drive_c/Need for Speed Underground 2/speed2.wine-nx.txt" <<'EOF'
          d3d=dxvk
          frame-limit=30
          vsync=1
          upscaling=fsr
          upscaling-sharpness=40%
          address-space=32-bit
          own-controls=0
          EOF

          # Keep Autorun's dinput8.dll. The branch now loads the ASI directly,
          # so only the Widescreen Fix's scripts are staged from the upstream
          # release; its Ultimate ASI Loader dinput8.dll is intentionally omitted.
          mkdir -p "overlay/switch/wine/drive_c/Need for Speed Underground 2/scripts"
          WS_ASI="$(find /tmp/nfsu2-widescreen -type f -iname 'NFSUnderground2.WidescreenFix.asi' | head -n1)"
          WS_DAT="$(find /tmp/nfsu2-widescreen -type f -iname 'NFSUnderground2.WidescreenFix.dat' | head -n1)"
          WS_INI="$(find /tmp/nfsu2-widescreen -type f -iname 'NFSUnderground2.WidescreenFix.ini' | head -n1)"
          test -n "$WS_ASI" && test -n "$WS_DAT" && test -n "$WS_INI"
          cp "$WS_ASI" "overlay/switch/wine/drive_c/Need for Speed Underground 2/scripts/"
          cp "$WS_DAT" "overlay/switch/wine/drive_c/Need for Speed Underground 2/scripts/"
          cp "$WS_INI" "overlay/switch/wine/drive_c/Need for Speed Underground 2/scripts/"

          python3 - <<'PY'
          from pathlib import Path
          p = Path("overlay/switch/wine/drive_c/Need for Speed Underground 2/scripts/NFSUnderground2.WidescreenFix.ini")
          s = p.read_text(errors="ignore")
          replacements = {
              "FixHUD": "1",
              "FixFOV": "1",
              "Scaling": "0",
              "FMVWidescreenMode": "1",
              "AutoFitFE": "0",
              "AutoFitFMV": "1",
              "SkipIntro": "1",
              "WindowedMode": "0",
              "DisableCutsceneBorders": "1",
              "ImproveGamepadSupport": "0",
              "FPSLimit": "-1",
              "SingleCoreAffinity": "1",
              "NoOpticalDriveFix": "1",
          }
          lines = s.splitlines()
          out = []
          seen = set()
          for line in lines:
              stripped = line.strip()
              if "=" in stripped and not stripped.startswith((";", "#")):
                  key = stripped.split("=", 1)[0].strip()
                  if key in replacements:
                      prefix = line[:len(line) - len(line.lstrip())]
                      out.append(f"{prefix}{key} = {replacements[key]}")
                      seen.add(key)
                      continue
              out.append(line)
          p.write_text("\n".join(out) + "\n")
          PY

          curl -L --fail --retry 3 \
            -o "overlay/switch/wine/drive_c/Need for Speed Underground 2/scripts/WidescreenFix-LICENSE.txt" \
            https://raw.githubusercontent.com/ThirteenAG/WidescreenFixesPack/master/license

          cat > overlay/README.txt <<'EOF'
          Autorun DirectInput test overlay for nfsu2-directinput.

          Copy the contents of this archive to the root of the Switch SD card
          and allow dinput.dll to be replaced.

          This test build exposes Autorun's existing Switch/XInput controller
          as a legacy DirectInput gamepad and adds an NFSU2 graphics profile:
          DXVK, 30 FPS cap, VSync and FSR upscaling.

          d3dx9_43.dll and the upstream MIT-licensed NFSU2 Widescreen Fix
          scripts are included. Do NOT copy the Widescreen Fix release's
          dinput8.dll into the game folder: Autorun now loads the ASI directly
          while keeping its own dinput8.dll for native controller support.

          In NFSU2 Video settings select 1280x720 after the fix loads. The
          DirectInput profile, DXVK, 30 FPS cap, VSync and FSR remain enabled.

          Keep a backup of the original:
            switch/wine/drive_c/windows/syswow64/dinput.dll
            switch/wine/drive_c/windows/syswow64/dinput8.dll
          EOF
          cd overlay
          zip -r ../autorun-directinput-nfsu2-test.zip .

      - name: Upload test overlay
        uses: actions/upload-artifact@v4
        with:
          name: autorun-directinput-nfsu2-test
          path: autorun-directinput-nfsu2-test.zip
          if-no-files-found: error
